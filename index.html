<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InspireHub — Daily Motivation</title>
  <meta name="description" content="InspireHub: Random motivational quotes, shareable and responsive." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f1724; /* dark navy */
      --card:#0b1220;
      --accent: linear-gradient(135deg,#7c3aed 0%,#06b6d4 100%);
      --glass: rgba(255,255,255,0.04);
      --muted: #9aa4b2;
      color-scheme: dark;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(circle at 10% 10%, rgba(7,10,26,0.6), transparent), var(--bg); color:#e6eef6}
    .container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .card{
      width:100%;max-width:880px;border-radius:18px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow: 0 10px 30px rgba(2,6,23,0.6);padding:28px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.03)
    }
    header{display:flex;align-items:center;gap:16px;margin-bottom:18px}
    .logo{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--glass);backdrop-filter: blur(6px);border:1px solid rgba(255,255,255,0.03)}
    .logo h1{font-family:Poppins,Inter; font-size:20px;margin:0;color:transparent;background:var(--accent);-webkit-background-clip:text;background-clip:text}
    h2{margin:0;font-size:18px;color:#ffffff}
    p.lead{color:var(--muted);margin-top:6px}

    .quote-area{display:flex;flex-direction:column;gap:18px;align-items:stretch}
    .quote-box{background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));padding:28px;border-radius:12px;border:1px solid rgba(255,255,255,0.02);min-height:140px;display:flex;flex-direction:column;justify-content:center}
    .quote{font-size:20px;line-height:1.45;margin:0;font-weight:600}
    .author{margin-top:12px;color:var(--muted);font-size:14px;text-align:right}

    .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .btn{padding:10px 14px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.06);cursor:pointer;color:#eaf3ff;font-weight:600;font-size:14px}
    .btn.primary{background:var(--accent);border:none;color:#051025;padding:10px 16px;box-shadow:0 6px 18px rgba(7,12,34,0.6)}
    .btn.ghost{background:transparent;border:1px dashed rgba(255,255,255,0.04)}

    .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
    .small{color:var(--muted);font-size:13px}

    /* responsive */
    @media (max-width:640px){
      .card{padding:18px}
      .quote{font-size:18px}
      header{gap:12px}
    }

    /* subtle animated shapes */
    .shape{position:absolute;border-radius:50%;filter:blur(40px);opacity:0.12}
    .shape.one{width:320px;height:320px;right:-80px;top:-80px;background:linear-gradient(135deg,#7c3aed,#06b6d4)}
    .shape.two{width:220px;height:220px;left:-70px;bottom:-60px;background:linear-gradient(0deg,#ef4444,#f97316)}

    /* small toast */
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:rgba(6,8,12,0.9);color:#e6eef6;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);display:none}
  </style>
</head>
<body>
  <div class="container">
    <div class="card" role="main">
      <div class="shape one" aria-hidden></div>
      <div class="shape two" aria-hidden></div>

      <header>
        <div class="logo" aria-hidden>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="4" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs></svg>
        </div>
        <div>
          <h2>InspireHub</h2>
          <p class="lead">Quick motivational quotes — click Generate for a new spark ✨</p>
        </div>
      </header>

      <section class="quote-area">
        <div class="quote-box" id="quoteBox">
          <p class="quote" id="quote">"The best time to plant a tree was 20 years ago. The second best time is now."</p>
          <div class="author" id="author">— Chinese Proverb</div>
        </div>

        <div class="controls">
          <button class="btn primary" id="newBtn">Generate New Quote</button>
          <button class="btn" id="copyBtn">Copy Quote</button>
          <button class="btn ghost" id="tweetBtn">Share on Twitter</button>
          <button class="btn" id="saveBtn">Save to local</button>
          <div style="flex:1"></div>
        </div>

        <div class="bottom">
          <div class="small">Made with ♥ — Frontend • HTML • CSS • JavaScript</div>
          <div class="small" id="count">Saved: 0</div>
        </div>
      </section>

    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard</div>

  <script>
    // Minimal, dependency-free JS
    (function(){
      const quotes = [
        {q: "The only way to do great work is to love what you do.", a: "Steve Jobs"},
        {q: "Don't watch the clock; do what it does. Keep going.", a: "Sam Levenson"},
        {q: "You are never too old to set another goal or to dream a new dream.", a: "C.S. Lewis"},
        {q: "Everything you can imagine is real.", a: "Pablo Picasso"},
        {q: "Success is not final, failure is not fatal: it is the courage to continue that counts.", a: "Winston Churchill"},
        {q: "It does not matter how slowly you go as long as you do not stop.", a: "Confucius"},
        {q: "Believe you can and you're halfway there.", a: "Theodore Roosevelt"},
        {q: "The future depends on what you do today.", a: "Mahatma Gandhi"},
        {q: "Act as if what you do makes a difference. It does.", a: "William James"},
        {q: "Small steps every day. That's how big things are built.", a: "Unknown"}
      ];

      const quoteEl = document.getElementById('quote');
      const authorEl = document.getElementById('author');
      const newBtn = document.getElementById('newBtn');
      const copyBtn = document.getElementById('copyBtn');
      const tweetBtn = document.getElementById('tweetBtn');
      const saveBtn = document.getElementById('saveBtn');
      const toast = document.getElementById('toast');
      const countEl = document.getElementById('count');

      function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
      function showToast(text){toast.textContent = text; toast.style.display='block'; setTimeout(()=>{toast.style.display='none'},1500)}

      function render(obj){
        quoteEl.textContent = '"' + obj.q + '"';
        authorEl.textContent = '— ' + obj.a;
      }

      newBtn.addEventListener('click', ()=>{
        const obj = quotes[rand(0,quotes.length-1)];
        render(obj);
        pulseCard();
      });

      copyBtn.addEventListener('click', ()=>{
        const text = quoteEl.textContent + ' ' + authorEl.textContent;
        navigator.clipboard?.writeText(text).then(()=>{
          showToast('Copied to clipboard');
        }).catch(()=>{showToast('Clipboard not available')});
      });

      tweetBtn.addEventListener('click', ()=>{
        const text = encodeURIComponent(quoteEl.textContent + ' ' + authorEl.textContent + ' — via InspireHub');
        const url = 'https://twitter.com/intent/tweet?text=' + text;
        window.open(url, '_blank');
      });

      // Save current quote to localStorage (simple saved list)
      function savedList(){
        try{ return JSON.parse(localStorage.getItem('inspirehub.saved') || '[]') }catch(e){return []}
      }
      function updateCount(){ countEl.textContent = 'Saved: ' + savedList().length }
      saveBtn.addEventListener('click', ()=>{
        const list = savedList();
        list.push({q: quoteEl.textContent, a: authorEl.textContent, at: new Date().toISOString()});
        localStorage.setItem('inspirehub.saved', JSON.stringify(list));
        updateCount();
        showToast('Saved locally');
      });

      // animate card pulse
      function pulseCard(){
        const box = document.getElementById('quoteBox');
        box.animate([
          { transform: 'scale(1)', boxShadow: '0 10px 30px rgba(2,6,23,0.6)' },
          { transform: 'scale(1.01)', boxShadow: '0 18px 40px rgba(2,6,23,0.75)' },
          { transform: 'scale(1)', boxShadow: '0 10px 30px rgba(2,6,23,0.6)' }
        ], { duration: 420, easing: 'cubic-bezier(.2,.9,.3,1)' });
      }

      // keyboard shortcut: N for new
      document.addEventListener('keydown', (e)=>{ if(e.key.toLowerCase()==='n') newBtn.click() });

      // preload random quote
      render(quotes[rand(0,quotes.length-1)]);
      updateCount();

      // progressive enhancement: try fetching a quotes API (if CORS allows)
      (async function tryRemote(){
        try{
          const res = await fetch('https://type.fit/api/quotes');
          if(!res.ok) return;
          const data = await res.json();
          // take random 20 and merge
          for(let i=0;i<20 && i<data.length;i++){
            const r = data[rand(0,data.length-1)];
            if(r && r.text){ quotes.push({q:r.text, a: r.author || 'Unknown'}) }
          }
        }catch(e){ /* network/CORS blocked — silent fallback */ }
      })();

    })();
  </script>
</body>
</html>
